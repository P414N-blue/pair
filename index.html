<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>커스텀 페어틀 메이커</title>
  <script src="https://unpkg.com/konva@9/konva.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #e9ecef; color: #333; }
    .container { display: flex; height: 100vh; }
    .sidebar { width: 340px; padding: 20px; background: #fff; border-right: 1px solid #ddd; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .sidebar h2 { font-size: 1.1rem; border-bottom: 2px solid #4a90e2; padding-bottom: 6px; margin-bottom: 4px; }
    .sidebar h3 { font-size: 0.9rem; color: #4a90e2; margin-top: 8px; }
    .input-group { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: bold; }
    input[type="file"], input[type="text"], input[type="color"] { padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
    .color-inputs { display: flex; gap: 6px; }
    .color-inputs input[type="color"] { width: 100%; height: 32px; padding: 0; cursor: pointer; border: none; background: none; }
    button { padding: 10px; background: #4a90e2; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #357abd; }
    .btn-save { margin-top: auto; background: #2ec4b6; font-size: 14px; padding: 12px; }
    .btn-save:hover { background: #239b90; }
    .canvas-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; overflow: auto; }
    #container { background: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.15); border-radius: 4px; }
    .guide-text { font-size: 11px; color: #666; font-weight: normal; }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <h2>🎨 페어틀 메이커</h2>
      <p class="guide-text">💡 이미지 위에서 **드래그로 이동**, **마우스 휠로 확대/축소**가 가능합니다.</p>

      <h3>메인 페어 (중앙)</h3>
      <div class="input-group"><label>중앙 일러스트</label><input type="file" id="up-main" accept="image/*"></div>

      <h3>캐릭터 1 (좌측)</h3>
      <div class="input-group"><label>글 설명</label><input type="text" id="txt-desc-1" placeholder="캐릭터 1 설명"></div>
      <div class="input-group">
        <label>컬러 팔레트</label>
        <div class="color-inputs">
          <input type="color" id="col-1-1" value="#ffadad">
          <input type="color" id="col-1-2" value="#ffd6a5">
          <input type="color" id="col-1-3" value="#fdffb6">
        </div>
      </div>
      <div class="input-group"><label>두상</label><input type="file" id="up-head-1" accept="image/*"></div>
      <div class="input-group"><label>전신</label><input type="file" id="up-full-1" accept="image/*"></div>
      <div class="input-group"><label>오브젝트</label><input type="file" id="up-etc-1" accept="image/*"></div>
      <div class="input-group"><label>동물화</label><input type="file" id="up-ani-1" accept="image/*"></div>
      <div class="input-group"><label>SD 전신</label><input type="file" id="up-sub-1" accept="image/*"></div>

      <h3>캐릭터 2 (우측)</h3>
      <div class="input-group"><label>글 설명</label><input type="text" id="txt-desc-2" placeholder="캐릭터 2 설명"></div>
      <div class="input-group">
        <label>컬러 팔레트</label>
        <div class="color-inputs">
          <input type="color" id="col-2-1" value="#caffbf">
          <input type="color" id="col-2-2" value="#9bf6ff">
          <input type="color" id="col-2-3" value="#a0c4ff">
        </div>
      </div>
      <div class="input-group"><label>두상</label><input type="file" id="up-head-2" accept="image/*"></div>
      <div class="input-group"><label>전신</label><input type="file" id="up-full-2" accept="image/*"></div>
      <div class="input-group"><label>오브젝트</label><input type="file" id="up-etc-2" accept="image/*"></div>
      <div class="input-group"><label>동물화</label><input type="file" id="up-ani-2" accept="image/*"></div>
      <div class="input-group"><label>SD 전신</label><input type="file" id="up-sub-2" accept="image/*"></div>

      <h3>하단 정보</h3>
      <div class="input-group"><label>곡명 - 아티스트</label><input type="text" id="txt-theme" placeholder="Song Title - Artist"></div>
      <div class="input-group"><label>테마곡 시간</label><input type="text" id="txt-time" value="1:24 / 3:45" placeholder="1:24 / 3:45"></div>
      <div class="input-group"><label>관계성 요약</label><input type="text" id="txt-relation" placeholder="관계성 한 줄 요약"></div>

      <button id="btn-save" class="btn-save">🖼️ PNG 저장하기</button>
    </div>

    <div class="canvas-wrapper">
      <div id="container"></div>
    </div>
  </div>

  <script>
    const WIDTH = 1100;
    const HEIGHT = 700;

    const stage = new Konva.Stage({ container: 'container', width: WIDTH, height: HEIGHT });
    const bgLayer = new Konva.Layer();
    const imageLayer = new Konva.Layer();
    const frameLayer = new Konva.Layer();
    const textLayer = new Konva.Layer();
    stage.add(bgLayer, imageLayer, frameLayer, textLayer);

    bgLayer.add(new Konva.Rect({ x: 0, y: 0, width: WIDTH, height: HEIGHT, fill: '#ffffff' }));

    const boxes = [
      // 좌측 (캐릭터 1)
      { id: 'h1', x: 20, y: 20, w: 150, h: 140, label: '두상' },
      { id: 'f1', x: 20, y: 170, w: 150, h: 410, label: '전신' },
      { id: 'd1', x: 180, y: 20, w: 120, h: 100, label: '글 설명', type: 'text' },
      { id: 'p1', x: 180, y: 130, w: 120, h: 30, label: '팔레트', type: 'palette_1' },
      { id: 'e1', x: 180, y: 170, w: 120, h: 110, label: '오브젝트' },
      { id: 'a1', x: 180, y: 290, w: 120, h: 110, label: '동물화' },
      { id: 's1', x: 180, y: 410, w: 120, h: 170, label: 'SD 전신' },

      // 중앙 메인
      { id: 'm', x: 310, y: 20, w: 480, h: 560, label: '메인 페어' },

      // 우측 (캐릭터 2)
      { id: 'd2', x: 800, y: 20, w: 120, h: 100, label: '글 설명', type: 'text' },
      { id: 'p2', x: 800, y: 130, w: 120, h: 30, label: '팔레트', type: 'palette_2' },
      { id: 'e2', x: 800, y: 170, w: 120, h: 110, label: '오브젝트' },
      { id: 'a2', x: 800, y: 290, w: 120, h: 110, label: '동물화' },
      { id: 's2', x: 800, y: 410, w: 120, h: 170, label: 'SD 전신' },
      { id: 'h2', x: 930, y: 20, w: 150, h: 140, label: '두상' },
      { id: 'f2', x: 930, y: 170, w: 150, h: 410, label: '전신' },

      // 하단
      { id: 'tm', x: 20, y: 595, w: 510, h: 85, label: '테마곡', type: 'player' },
      { id: 'rel', x: 550, y: 595, w: 530, h: 85, label: '관계성 요약', type: 'text' }
    ];

    const paletteNodes = {};
    const boxGroups = {};
    const labelNodes = {};
    let timeTextNode = null; // 시간 텍스트 참조용 변수

    boxes.forEach(b => {
      const group = new Konva.Group({
        x: b.x, y: b.y, width: b.w, height: b.h,
        clipFunc: function(ctx) { ctx.rect(0, 0, b.w, b.h); }
      });
      imageLayer.add(group);
      boxGroups[b.id] = group;

      frameLayer.add(new Konva.Rect({
        x: b.x, y: b.y, width: b.w, height: b.h,
        stroke: '#bbb', strokeWidth: 1.5, cornerRadius: 4, listening: false
      }));

      if (b.type !== 'player' && b.type !== 'palette_1' && b.type !== 'palette_2') {
        const labelText = new Konva.Text({
          x: b.x + 6, y: b.y + 6, text: b.label, fontSize: 11, fill: '#aaa', listening: false
        });
        frameLayer.add(labelText);
        labelNodes[b.id] = labelText;
      }

      if (b.type === 'palette_1' || b.type === 'palette_2') {
        const pGroup = new Konva.Group({ x: b.x + 6, y: b.y + 5 });
        paletteNodes[b.type] = [];
        for (let i = 0; i < 3; i++) {
          const rect = new Konva.Rect({
            x: i * 36, y: 0, width: 30, height: 20,
            fill: '#ffffff', stroke: '#999', strokeWidth: 1, cornerRadius: 3
          });
          pGroup.add(rect);
          paletteNodes[b.type].push(rect);
        }
        frameLayer.add(pGroup);
      }
    });

    // 플레이어 UI 생성
    const tmBox = boxes.find(b => b.id === 'tm');
    if (tmBox) {
      const pGroup = new Konva.Group({ x: tmBox.x, y: tmBox.y });
      pGroup.add(new Konva.Circle({ x: 25, y: 42, radius: 14, fill: '#4a90e2' }));
      pGroup.add(new Konva.Path({ x: 21, y: 35, data: 'M0 0 L12 7 L0 14 Z', fill: '#ffffff' }));
      pGroup.add(new Konva.Rect({ x: 50, y: 48, width: tmBox.w - 130, height: 6, fill: '#e0e0e0', cornerRadius: 3 }));
      pGroup.add(new Konva.Rect({ x: 50, y: 48, width: (tmBox.w - 130) * 0.4, height: 6, fill: '#4a90e2', cornerRadius: 3 }));
      pGroup.add(new Konva.Circle({ x: 50 + (tmBox.w - 130) * 0.4, y: 51, radius: 6, fill: '#4a90e2' }));

      // 수정 가능한 타임스탬프 텍스트 노드
      timeTextNode = new Konva.Text({
        x: tmBox.w - 75, y: 44, text: '1:24 / 3:45', fontSize: 10, fill: '#888', align: 'right'
      });
      pGroup.add(timeTextNode);
      frameLayer.add(pGroup);
    }

    // 시간 입력란 이벤트 바인딩
    document.getElementById('txt-time').addEventListener('input', e => {
      if (timeTextNode) {
        timeTextNode.text(e.target.value.trim());
        frameLayer.batchDraw();
      }
    });

    // 이미지 바인딩
    function bindImage(inputId, boxId) {
      const box = boxes.find(b => b.id === boxId);
      const group = boxGroups[boxId];

      document.getElementById(inputId).addEventListener('change', e => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = ev => {
          const img = new Image();
          img.src = ev.target.result;
          img.onload = () => {
            group.destroyChildren();

            const kImg = new Konva.Image({ x: 0, y: 0, image: img, draggable: true });
            const scale = Math.max(box.w / img.width, box.h / img.height);
            kImg.scale({ x: scale, y: scale });

            kImg.on('wheel', e => {
              e.evt.preventDefault();
              const oldScale = kImg.scaleX();
              const scaleBy = 1.08;
              const newScale = e.evt.deltaY < 0 ? oldScale * scaleBy : oldScale / scaleBy;

              if (newScale * img.width >= box.w / 2 && newScale * img.height >= box.h / 2) {
                kImg.scale({ x: newScale, y: newScale });
                imageLayer.draw();
              }
            });

            group.add(kImg);
            imageLayer.draw();

            if (labelNodes[boxId]) {
              labelNodes[boxId].visible(false);
              frameLayer.batchDraw();
            }
          };
        };
        reader.readAsDataURL(file);
      });
    }

    bindImage('up-main', 'm');
    bindImage('up-head-1', 'h1'); bindImage('up-full-1', 'f1'); bindImage('up-etc-1', 'e1'); bindImage('up-ani-1', 'a1'); bindImage('up-sub-1', 's1');
    bindImage('up-head-2', 'h2'); bindImage('up-full-2', 'f2'); bindImage('up-etc-2', 'e2'); bindImage('up-ani-2', 'a2'); bindImage('up-sub-2', 's2');

    // 텍스트 바인딩
    function bindText(inputId, boxId, defaultText, offsetY = 12) {
      const box = boxes.find(b => b.id === boxId);
      const tNode = new Konva.Text({
        x: box.x + 10, y: box.y + offsetY, text: '',
        fontSize: 12, fill: '#333', width: box.w - 20, wrap: 'char'
      });
      textLayer.add(tNode);

      document.getElementById(inputId).addEventListener('input', e => {
        const val = e.target.value.trim();
        tNode.text(val);
        textLayer.draw();

        if (labelNodes[boxId]) {
          labelNodes[boxId].visible(val === '');
          frameLayer.batchDraw();
        }
      });
    }

    bindText('txt-desc-1', 'd1', '');
    bindText('txt-desc-2', 'd2', '');
    bindText('txt-theme', 'tm', '', 18);
    bindText('txt-relation', 'rel', '');

    // 팔레트 연동
    function bindPalette(groupId, keys) {
      keys.forEach((key, idx) => {
        const inputEl = document.getElementById(key);
        
        inputEl.addEventListener('input', e => {
          if (paletteNodes[groupId] && paletteNodes[groupId][idx]) {
            paletteNodes[groupId][idx].fill(String(e.target.value));
            frameLayer.batchDraw();
          }
        });

        if (paletteNodes[groupId] && paletteNodes[groupId][idx]) {
          paletteNodes[groupId][idx].fill(String(inputEl.value));
        }
      });
    }

    bindPalette('palette_1', ['col-1-1', 'col-1-2', 'col-1-3']);
    bindPalette('palette_2', ['col-2-1', 'col-2-2', 'col-2-3']);
    frameLayer.draw();

    // 저장 기능
    document.getElementById('btn-save').addEventListener('click', () => {
      const dataURL = stage.toDataURL({ pixelRatio: 2 });
      const link = document.createElement('a');
      link.download = 'pair.png';
      link.href = dataURL;
      link.click();
    });
  </script>
</body>
</html>
