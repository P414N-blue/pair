<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대형 페어틀 메이커</title>
  
  <!-- Konva.js CDN -->
  <script src="https://unpkg.com/konva@9/konva.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f0f2f5;
      color: #333;
    }

    .container {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* 사이드바 스타일 */
    .sidebar {
      width: 320px;
      padding: 20px;
      background: #ffffff;
      border-right: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      box-shadow: 2px 0 8px rgba(0,0,0,0.05);
      z-index: 10;
    }

    .sidebar h2 {
      font-size: 1.2rem;
      color: #1a1a1a;
      border-bottom: 2px solid #4a90e2;
      padding-bottom: 8px;
    }

    .upload-group, .text-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #555;
    }

    input[type="file"] {
      font-size: 12px;
      padding: 6px;
      background: #f8f9fa;
      border: 1px solid #ddd;
      border-radius: 6px;
      cursor: pointer;
    }

    input[type="text"] {
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #4a90e2;
    }

    button {
      padding: 10px;
      background-color: #4a90e2;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #357abd;
    }

    .btn-save {
      margin-top: auto;
      background-color: #2ec4b6;
      font-size: 15px;
      padding: 12px;
    }

    .btn-save:hover {
      background-color: #239b90;
    }

    /* 캔버스 영역 스타일 */
    .canvas-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: auto;
      background-color: #e9ecef;
    }

    #container {
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      background-color: #ffffff;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 왼쪽 조작 패널 -->
    <div class="sidebar">
      <h2>🎨 페어틀 메이커</h2>
      
      <div class="upload-group">
        <label>1. 메인 페어 (Center)</label>
        <input type="file" id="upload-main" accept="image/*">
      </div>

      <div class="upload-group">
        <label>2. LD 두상 (Top-Left)</label>
        <input type="file" id="upload-ld-head" accept="image/*">
      </div>

      <div class="upload-group">
        <label>3. SD 전신 (Top-Right)</label>
        <input type="file" id="upload-sd" accept="image/*">
      </div>

      <div class="upload-group">
        <label>4. 동물화 (Bottom-Left)</label>
        <input type="file" id="upload-animal" accept="image/*">
      </div>

      <hr style="border: 0; border-top: 1px solid #eee;">

      <div class="text-group">
        <label>캐릭터 이름 / 문구</label>
        <input type="text" id="text-input" placeholder="이름을 입력하세요">
        <button id="btn-add-text">텍스트 추가</button>
      </div>

      <button id="btn-export" class="btn-save">🖼️ PNG 이미지 저장</button>
    </div>

    <!-- 오른쪽 캔버스 출력 영역 -->
    <div class="canvas-wrapper">
      <div id="container"></div>
    </div>
  </div>

  <script>
    // 캔버스 크기 설정 (비율 4:3 기준 1000x750)
    const WIDTH = 1000;
    const HEIGHT = 750;

    const stage = new Konva.Stage({
      container: 'container',
      width: WIDTH,
      height: HEIGHT,
    });

    // 레이어 순서 등록 (배경 -> 이미지 -> 가이드/프레임 -> 텍스트)
    const bgLayer = new Konva.Layer();
    const imageLayer = new Konva.Layer();
    const frameLayer = new Konva.Layer();
    const textLayer = new Konva.Layer();

    stage.add(bgLayer, imageLayer, frameLayer, textLayer);

    // 이미지 조작 컨트롤러 (Transformer)
    const tr = new Konva.Transformer({
      keepRatio: true,
      enabledAnchors: ['top-left', 'top-right', 'bottom-left', 'bottom-right'],
      borderStroke: '#4a90e2',
      anchorFill: '#ffffff',
      anchorStroke: '#4a90e2',
      anchorSize: 8
    });
    imageLayer.add(tr);

    // 바탕 흰색 배경
    const bgRect = new Konva.Rect({
      x: 0,
      y: 0,
      width: WIDTH,
      height: HEIGHT,
      fill: '#ffffff',
    });
    bgLayer.add(bgRect);

    // 구역 분할 가이드선 생성
    function drawGuideLines() {
      const lineStyle = { stroke: '#cccccc', strokeWidth: 1.5, dash: [6, 6] };
      const textStyle = { fontSize: 13, fill: '#aaaaaa', fontFamily: 'sans-serif' };

      // LD 두상
      frameLayer.add(new Konva.Rect({ x: 20, y: 20, width: 280, height: 340, ...lineStyle }));
      frameLayer.add(new Konva.Text({ x: 30, y: 30, text: '[ LD 두상 영역 ]', ...textStyle }));

      // SD 전신
      frameLayer.add(new Konva.Rect({ x: 700, y: 20, width: 280, height: 340, ...lineStyle }));
      frameLayer.add(new Konva.Text({ x: 710, y: 30, text: '[ SD 전신 영역 ]', ...textStyle }));

      // 동물화
      frameLayer.add(new Konva.Rect({ x: 20, y: 380, width: 280, height: 340, ...lineStyle }));
      frameLayer.add(new Konva.Text({ x: 30, y: 390, text: '[ 동물화 영역 ]', ...textStyle }));

      // 메인 페어
      frameLayer.add(new Konva.Rect({ x: 320, y: 20, width: 360, height: 700, ...lineStyle }));
      frameLayer.add(new Konva.Text({ x: 330, y: 30, text: '[ 메인 페어 영역 ]', ...textStyle }));

      frameLayer.draw();
    }
    drawGuideLines();

    // 이미지 업로드 처리 함수
    function handleImageUpload(inputId, defaultX, defaultY) {
      document.getElementById(inputId).addEventListener('change', function (e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function (event) {
          const imgObj = new Image();
          imgObj.src = event.target.result;

          imgObj.onload = function () {
            const konvaImg = new Konva.Image({
              x: defaultX,
              y: defaultY,
              image: imgObj,
              draggable: true,
            });

            // 업로드 시 너비 250px에 맞춰 자동 비율 축소
            const scale = 250 / imgObj.width;
            konvaImg.scale({ x: scale, y: scale });

            // 클릭 시 조절용 프레임(Transformer) 활성화
            konvaImg.on('click tap', () => {
              tr.nodes([konvaImg]);
              imageLayer.draw();
            });

            imageLayer.add(konvaImg);
            tr.nodes([konvaImg]);
            imageLayer.draw();
          };
        };
        reader.readAsDataURL(file);
      });
    }

    // 각 인풋 버튼에 위치 지정 연동
    handleImageUpload('upload-ld-head', 35, 40);
    handleImageUpload('upload-sd', 715, 40);
    handleImageUpload('upload-animal', 35, 400);
    handleImageUpload('upload-main', 375, 100);

    // 바탕을 클릭하면 선택(조절점) 해제
    stage.on('click tap', function (e) {
      if (e.target === stage || e.target === bgRect) {
        tr.nodes([]);
        imageLayer.draw();
      }
    });

    // 텍스트 추가 기능
    document.getElementById('btn-add-text').addEventListener('click', () => {
      const input = document.getElementById('text-input');
      const val = input.value;
      if (!val) return;

      const text = new Konva.Text({
        x: 350,
        y: 680,
        text: val,
        fontSize: 22,
        fontFamily: 'sans-serif',
        fontStyle: 'bold',
        fill: '#333333',
        draggable: true,
      });

      textLayer.add(text);
      textLayer.draw();
      input.value = ''; // 입력창 초기화
    });

    // 고화질 PNG 저장 기능
    document.getElementById('btn-export').addEventListener('click', () => {
      tr.nodes([]); // 선택 테두리 제거
      imageLayer.draw();

      // pixelRatio: 2 -> 고화질(2000x1500) 해상도로 내보내기
      const dataURL = stage.toDataURL({ pixelRatio: 2 });
      const link = document.createElement('a');
      link.download = 'pair.png';
      link.href = dataURL;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });
  </script>
</body>
</html>
